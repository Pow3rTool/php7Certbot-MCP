# Include inside the existing public-host nginx server block.
# The service-prefix route also exposes /.well-known/oauth-protected-resource.
location = /.well-known/oauth-protected-resource/certbot {
    proxy_pass http://127.0.0.1:8785/.well-known/oauth-protected-resource;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
}
